services:
  db:
    image: postgres:18-alpine
    container_name: basketball_league_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - basketball_league_net
    ports:
      - "5432:5432"

  app:
    build: .
    image: ognenmladenovski767/basketball-league:latest
    container_name: basketball_league_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - basketball_league_net

  adminer:
    image: adminer:4
    container_name: basketball_league_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST}
    depends_on:
      - db
    networks:
      - basketball_league_net

volumes:
  postgres_data:

networks:
  basketball_league_net:
    driver: bridge