apiVersion: apps/v1
kind: Deployment
metadata:
  name: basketball-app
  namespace: basketball-league-tracker
  labels:
    app.kubernetes.io/name: basketball-league-tracker
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: basketball-league-tracker
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basketball-league-tracker
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:18-alpine
          envFrom:
            - configMapRef:
                name: basketball-league-tracker-config
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT"; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
      containers:
        - name: app
          image: ognenmladenovski767/basketball-league-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: basketball-league-tracker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: basketball-league-tracker-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basketball-league-tracker-secret
                  key: password

          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi