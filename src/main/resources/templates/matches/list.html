<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Matches', ~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <div class="kicker" th:text="|${#lists.size(matches)} matches|">21 matches</div>
            <h1>Matches</h1>
        </div>
        <div class="header-actions">
            <a class="nb-button pale-yellow" th:href="@{/matches/new(leagueId=${selectedLeagueId})}">Schedule match</a>
        </div>
    </div>

    <form class="filters" method="get" th:action="@{/matches}">
        <div class="nb-form-group">
            <label for="leagueId">League</label>
            <select class="nb-input default" id="leagueId" name="leagueId">
                <option value="">All leagues</option>
                <option th:each="l : ${leagues}" th:value="${l.id}" th:text="${l.name}"
                        th:selected="${l.id == selectedLeagueId}">League</option>
            </select>
        </div>
        <div class="nb-form-group">
            <label for="status">Status</label>
            <select class="nb-input default" id="status" name="status">
                <option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"
                        th:selected="${s == selectedStatus}">Played</option>
            </select>
        </div>
        <button class="nb-button default" type="submit">Filter</button>
        <a class="clear" th:href="@{/matches}" th:if="${selectedLeagueId != null or selectedStatus != null}">Clear</a>
    </form>

    <div class="table-wrap">
        <table class="nb-table bordered">
            <thead>
            <tr>
                <th>Date</th>
                <th class="num">Home</th>
                <th class="center">Score</th>
                <th>Away</th>
                <th>League</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${matches}">
                <td class="small date" th:text="${#temporals.format(m.playedAt, 'd MMM yyyy, HH:mm')}">date</td>
                <td class="team-cell right" th:classappend="${m.awayWin} ? 'loser'" th:text="${m.homeTeam.name}">Home</td>
                <td class="score" th:if="${m.played}" th:text="|${m.homeScore}–${m.awayScore}|">0–0</td>
                <td class="score pending" th:unless="${m.played}">vs</td>
                <td class="team-cell" th:classappend="${m.homeWin} ? 'loser'" th:text="${m.awayTeam.name}">Away</td>
                <td><a th:replace="~{fragments/league :: chip(${m.league})}"></a></td>
                <td class="status"><span th:classappend="${m.played} ? 'played'" th:text="${m.status.displayName}">Played</span></td>
                <td class="actions">
                    <a th:unless="${m.played}" th:href="@{/matches/{id}/score(id=${m.id})}">Enter score</a>
                    <a th:if="${m.played}" th:href="@{/matches/{id}/score(id=${m.id})}">Edit score</a>
                    <form th:action="@{/matches/{id}/delete(id=${m.id})}" method="post"
                          onsubmit="return confirm('Delete this match?')">
                        <button class="link-btn danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(matches)}">
                <td colspan="7" class="empty">No matches match these filters.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
