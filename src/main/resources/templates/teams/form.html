<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${teamId == null} ? 'Add team' : 'Edit team', ~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <div class="kicker">Teams</div>
            <h1 th:text="${teamId == null} ? 'Add team' : 'Edit team'">Add team</h1>
        </div>
    </div>

    <form class="form" th:object="${form}" method="post"
          th:action="${teamId == null} ? @{/teams} : @{/teams/{id}(id=${teamId})}">

        <div class="row">
            <div class="nb-form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label for="name">Team name</label>
                <input class="nb-input default" id="name" type="text" th:field="*{name}">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="nb-form-group" th:classappend="${#fields.hasErrors('city')} ? 'has-error'">
                <label for="city">City</label>
                <input class="nb-input default" id="city" type="text" th:field="*{city}">
                <div class="error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
            </div>
        </div>

        <div class="row">
            <div class="nb-form-group" th:classappend="${#fields.hasErrors('homeArena')} ? 'has-error'">
                <label for="homeArena">Home arena</label>
                <input class="nb-input default" id="homeArena" type="text" th:field="*{homeArena}">
                <div class="error" th:if="${#fields.hasErrors('homeArena')}" th:errors="*{homeArena}"></div>
            </div>
            <div class="nb-form-group" th:classappend="${#fields.hasErrors('foundedYear')} ? 'has-error'">
                <label for="foundedYear">Founded</label>
                <input class="nb-input default" id="foundedYear" type="number" min="1891" max="2100" th:field="*{foundedYear}">
                <div class="error" th:if="${#fields.hasErrors('foundedYear')}" th:errors="*{foundedYear}"></div>
            </div>
        </div>

        <div class="nb-form-group" th:classappend="${#fields.hasErrors('leagueIds')} ? 'has-error'">
            <span class="label">Leagues</span>
            <div class="checks">
                <label class="check" th:each="l : ${leagues}">
                    <input type="checkbox" th:field="*{leagueIds}" th:value="${l.id}">
                    <span th:text="|${l.name} (${l.season})|">League</span>
                </label>
            </div>
            <div class="error" th:if="${#fields.hasErrors('leagueIds')}" th:errors="*{leagueIds}"></div>
        </div>

        <div class="form-actions">
            <button class="nb-button pale-yellow" type="submit" th:text="${teamId == null} ? 'Add team' : 'Save changes'">Save</button>
            <a th:href="@{/teams}">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
