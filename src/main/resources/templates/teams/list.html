<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Teams', ~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <div class="kicker" th:text="|${#lists.size(teams)} teams|">10 teams</div>
            <h1>Teams</h1>
        </div>
        <div class="header-actions">
            <a class="nb-button pale-yellow" th:href="@{/teams/new(leagueId=${selectedLeagueId})}">Add team</a>
        </div>
    </div>

    <form class="filters" method="get" th:action="@{/teams}">
        <div class="nb-form-group">
            <label for="leagueId">League</label>
            <select class="nb-input default" id="leagueId" name="leagueId">
                <option value="">All leagues</option>
                <option th:each="l : ${leagues}" th:value="${l.id}" th:text="${l.name}"
                        th:selected="${l.id == selectedLeagueId}">League</option>
            </select>
        </div>
        <button class="nb-button default" type="submit">Filter</button>
        <a class="clear" th:href="@{/teams}" th:if="${selectedLeagueId != null}">Clear</a>
    </form>

    <div class="table-wrap">
        <table class="nb-table bordered">
            <thead>
            <tr>
                <th>Team</th>
                <th>City</th>
                <th>Home arena</th>
                <th class="num">Founded</th>
                <th>Leagues</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${teams}">
                <td class="team-cell" th:text="${t.name}">Team</td>
                <td th:text="${t.city}">City</td>
                <td th:text="${t.homeArena}">Arena</td>
                <td class="num" th:text="${t.foundedYear}">1966</td>
                <td>
                    <span class="chips">
                        <th:block th:each="l : ${t.leagues}">
                            <a th:replace="~{fragments/league :: chip(${l})}"></a>
                        </th:block>
                    </span>
                </td>
                <td class="actions">
                    <a th:href="@{/players(teamId=${t.id})}">Roster</a>
                    <a th:href="@{/teams/{id}/edit(id=${t.id})}">Edit</a>
                    <form th:action="@{/teams/{id}/delete(id=${t.id})}" method="post"
                          th:data-name="${t.name}"
                          onsubmit="return confirm('Remove ' + this.dataset.name + ', its players and its matches?')">
                        <button class="link-btn danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(teams)}">
                <td colspan="6" class="empty">No teams match this filter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
